<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">Block layouts of the formats</title><desc id="d">The unit each format encodes: PlayStation VAG uses 16-byte blocks of 28 samples, Nintendo DSP 8-byte frames of 14 samples, CRI ADX 18-byte blocks of 32 samples, and CD-ROM XA 128-byte sound groups with 16 bytes of parameters. Yamaha AICA and OKI ADPCM have no blocks at all: just a stream of 4-bit codes.</desc><style>text{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#e6ecf5}.dim{fill:#9fb4cc}.box{fill:#14202e;stroke:#3b5a7c;stroke-width:1.5}.ok{fill:#1a2c1f;stroke:#4f8a5e;stroke-width:1.5}.hot{fill:#2a2216;stroke:#a67c2e;stroke-width:1.5}.arrow{stroke:#7fa6cf;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fa6cf"/></marker></defs><rect width="100%" height="100%" rx="10" fill="#0b0f14" stroke="#24364a"/><text x="20" y="26" font-size="14" font-weight="600">What one block looks like (widths to scale within a row)</text>
  <text x="20" y="68" font-size="13" font-weight="600">PlayStation VAG</text><text class="dim" x="20" y="84" font-size="10.5">16 bytes = 28 samples</text><rect class="hot" x="170.0" y="48" width="35.0" height="40" rx="4"/><text x="187.5" y="72" text-anchor="middle" font-size="9.5">f|r</text><rect class="box" x="205.0" y="48" width="35.0" height="40" rx="4"/><text x="222.5" y="72" text-anchor="middle" font-size="9.5">flag</text><rect class="ok" x="240.0" y="48" width="490.0" height="40" rx="4"/><text x="485.0" y="72" text-anchor="middle" font-size="11.5">28 four-bit codes</text>
  <text x="20" y="118" font-size="13" font-weight="600">Nintendo DSP</text><text class="dim" x="20" y="134" font-size="10.5">8 bytes = 14 samples</text><rect class="hot" x="170.0" y="98" width="70.0" height="40" rx="4"/><text x="205.0" y="122" text-anchor="middle" font-size="11.5">p|s</text><rect class="ok" x="240.0" y="98" width="490.0" height="40" rx="4"/><text x="485.0" y="122" text-anchor="middle" font-size="11.5">14 four-bit codes</text>
  <text x="20" y="168" font-size="13" font-weight="600">CRI ADX</text><text class="dim" x="20" y="184" font-size="10.5">18 bytes = 32 samples</text><rect class="hot" x="170.0" y="148" width="62.2" height="40" rx="4"/><text x="201.1" y="172" text-anchor="middle" font-size="11.5">step</text><rect class="ok" x="232.2" y="148" width="497.8" height="40" rx="4"/><text x="481.1" y="172" text-anchor="middle" font-size="11.5">32 four-bit codes</text>
  <text x="20" y="218" font-size="13" font-weight="600">CD-ROM XA</text><text class="dim" x="20" y="234" font-size="10.5">128 bytes = 8 units x 28</text><rect class="hot" x="170.0" y="198" width="70.0" height="40" rx="4"/><text x="205.0" y="222" text-anchor="middle" font-size="11.5">params</text><rect class="ok" x="240.0" y="198" width="490.0" height="40" rx="4"/><text x="485.0" y="222" text-anchor="middle" font-size="11.5">112 bytes: 28 words of 4 bytes, the 8 units interleaved</text>
  <text x="20" y="268" font-size="13" font-weight="600">Yamaha AICA, OKI</text><text class="dim" x="20" y="284" font-size="10.5">no blocks: one code per sample</text><rect class="ok" x="170.0" y="248" width="560.0" height="40" rx="4"/><text x="450.0" y="272" text-anchor="middle" font-size="11.5">stream of 4-bit codes; the step size adapts as it goes</text>
  <text class="dim" x="20" y="316" font-size="11">f|r = filter and range, p|s = predictor and scale. Orange fields are what the encoder chooses per block.</text></svg>