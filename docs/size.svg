<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">Size as a share of 16-bit PCM</title><desc id="d">Every format is a fixed-rate four-bit-per-sample style codec, so files come out at about a quarter to 29 percent of the size of 16-bit PCM.</desc><style>text{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#e6ecf5}.dim{fill:#9fb4cc}</style><rect width="100%" height="100%" rx="10" fill="#0b0f14" stroke="#24364a"/><text x="20" y="26" font-size="14" font-weight="600">File size as a percentage of 16-bit PCM (lower is smaller)</text><text x="120" y="77.42857142857143" font-size="12.5" text-anchor="end">VAG</text><rect x="130" y="60" width="421.9" height="24.9" rx="3" fill="#4f8a5e"/><text x="559.85" y="77.42857142857143" font-size="12" font-weight="600">28.6%  (4.57 bits/sample)</text><text x="120" y="112.28571428571429" font-size="12.5" text-anchor="end">XA</text><rect x="130" y="94.85714285714286" width="430.7" height="24.9" rx="3" fill="#4f8a5e"/><text x="568.7" y="112.28571428571429" font-size="12" font-weight="600">29.2%  (4.68 bits/sample)</text><text x="120" y="147.14285714285714" font-size="12.5" text-anchor="end">DSP</text><rect x="130" y="129.71428571428572" width="421.9" height="24.9" rx="3" fill="#4f8a5e"/><text x="559.85" y="147.14285714285714" font-size="12" font-weight="600">28.6%  (4.57 bits/sample)</text><text x="120" y="181.99999999999997" font-size="12.5" text-anchor="end">ADX</text><rect x="130" y="164.57142857142856" width="414.5" height="24.9" rx="3" fill="#4f8a5e"/><text x="552.475" y="181.99999999999997" font-size="12" font-weight="600">28.1%  (4.5 bits/sample)</text><text x="120" y="216.85714285714283" font-size="12.5" text-anchor="end">AICA</text><rect x="130" y="199.42857142857142" width="368.8" height="24.9" rx="3" fill="#4f8a5e"/><text x="506.75" y="216.85714285714283" font-size="12" font-weight="600">25%  (4 bits/sample)</text><text x="120" y="251.7142857142857" font-size="12.5" text-anchor="end">Yamaha WAV</text><rect x="130" y="234.28571428571428" width="368.8" height="24.9" rx="3" fill="#4f8a5e"/><text x="506.75" y="251.7142857142857" font-size="12" font-weight="600">25%  (4 bits/sample)</text><text x="120" y="286.57142857142856" font-size="12.5" text-anchor="end">OKI WAV</text><rect x="130" y="269.1428571428571" width="368.8" height="24.9" rx="3" fill="#4f8a5e"/><text x="506.75" y="286.57142857142856" font-size="12" font-weight="600">25%  (4.01 bits/sample)</text></svg>