<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="t d"><title id="t">How gamedac encodes a block</title><desc id="d">Samples are cut into small blocks. For each block the encoder tries every predictor and scale the format allows, decodes each trial exactly as the real decoder would, keeps the one with the smallest error, and writes the nibbles, the choice and a header. Because the trial uses the decoder's own arithmetic, what you hear is what the encoder measured.</desc><style>text{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#e6ecf5}.dim{fill:#9fb4cc}.box{fill:#14202e;stroke:#3b5a7c;stroke-width:1.5}.ok{fill:#1a2c1f;stroke:#4f8a5e;stroke-width:1.5}.hot{fill:#2a2216;stroke:#a67c2e;stroke-width:1.5}.arrow{stroke:#7fa6cf;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fa6cf"/></marker></defs><rect width="100%" height="100%" rx="10" fill="#0b0f14" stroke="#24364a"/><text x="20" y="26" font-size="14" font-weight="600">How a block is encoded (the same idea for every format)</text>
  <rect class="box" x="20" y="50" width="150" height="58" rx="8"/><text x="95" y="76" text-anchor="middle" font-size="13.5" font-weight="600">PCM samples</text><text class="dim" x="95" y="94" text-anchor="middle" font-size="11">float or Int16, 1 or 2 ch</text><path class="arrow" d="M170,79 L206,79"/>
  <rect class="box" x="208" y="50" width="170" height="58" rx="8"/><text x="293" y="76" text-anchor="middle" font-size="13.5" font-weight="600">Cut into blocks</text><text class="dim" x="293" y="94" text-anchor="middle" font-size="11">14, 28 or 32 samples</text><path class="arrow" d="M378,79 L414,79"/>
  <rect class="box" x="416" y="50" width="150" height="58" rx="8"/><text x="491" y="76" text-anchor="middle" font-size="13.5" font-weight="600">For every trial</text><text class="dim" x="491" y="94" text-anchor="middle" font-size="11">predictor x scale</text><path class="arrow" d="M566,79 L602,79"/>
  <rect class="hot" x="604" y="50" width="136" height="58" rx="8"/><text x="672" y="76" text-anchor="middle" font-size="13.5" font-weight="600">Predict</text><text class="dim" x="672" y="94" text-anchor="middle" font-size="11">from the last 2 outputs</text>
  <path class="arrow" d="M672,108 L672,142"/>
  <rect class="hot" x="604" y="144" width="136" height="58" rx="8"/><text x="672" y="170" text-anchor="middle" font-size="13.5" font-weight="600">Quantise to 4 bits</text><text class="dim" x="672" y="188" text-anchor="middle" font-size="11">round the residual</text><path class="arrow" d="M604,173 L568,173"/>
  <rect class="hot" x="380" y="144" width="186" height="58" rx="8"/><text x="473" y="170" text-anchor="middle" font-size="13.5" font-weight="600">Decode the trial</text><text class="dim" x="473" y="188" text-anchor="middle" font-size="11">with the decoder's own arithmetic</text><path class="arrow" d="M380,173 L344,173"/>
  <rect class="box" x="168" y="144" width="176" height="58" rx="8"/><text x="256" y="170" text-anchor="middle" font-size="13.5" font-weight="600">Keep the smallest error</text><text class="dim" x="256" y="188" text-anchor="middle" font-size="11">across all trials</text>
  <path class="arrow" d="M256,202 L256,236"/>
  <rect class="ok" x="168" y="238" width="176" height="58" rx="8"/><text x="256" y="264" text-anchor="middle" font-size="13.5" font-weight="600">Write the block</text><text class="dim" x="256" y="282" text-anchor="middle" font-size="11">choice + 4-bit codes</text><path class="arrow" d="M168,267 L132,267"/>
  <rect class="ok" x="20" y="238" width="112" height="58" rx="8"/><text x="76" y="264" text-anchor="middle" font-size="13.5" font-weight="600">Container</text><text class="dim" x="76" y="282" text-anchor="middle" font-size="11">header, loops, CRC</text>
  <text class="dim" x="372" y="250" font-size="11.5">Closed loop: each block starts from the decoder state</text>
  <text class="dim" x="372" y="266" font-size="11.5">the previous block left, so errors do not pile up.</text>
  <text class="dim" x="372" y="286" font-size="11.5">DSP also analyses the whole clip first to choose its</text>
  <text class="dim" x="372" y="302" font-size="11.5">8 predictor pairs. ADX picks a step, not a filter.</text></svg>