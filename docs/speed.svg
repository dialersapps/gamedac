<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="t d"><title id="t">Speed as multiples of real time</title><desc id="d">Encoding and decoding speed for each format in multiples of real time, for 10 seconds of audio at the format's own rate. Decoding is much faster than encoding; DSP encoding is the slowest because it analyses the whole clip for predictors.</desc><style>text{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#e6ecf5}.dim{fill:#9fb4cc}</style><rect width="100%" height="100%" rx="10" fill="#0b0f14" stroke="#24364a"/><text x="20" y="26" font-size="14" font-weight="600">Speed: how many times faster than real time (10 s clips)</text><rect x="130" y="40" width="14" height="4" fill="#4da3ff"/><text x="150" y="46" font-size="11">encode</text><rect x="220" y="40" width="14" height="4" fill="#4f8a5e"/><text x="240" y="46" font-size="11">decode</text><text x="120" y="94" font-size="12.5" text-anchor="end">VAG</text><rect x="130" y="75" width="3.1" height="15.0" rx="3" fill="#4da3ff"/><text x="139.06748466257667" y="88" font-size="10.5" class="dim">61x (163 ms)</text><rect x="130" y="90" width="166.7" height="15.0" rx="3" fill="#4f8a5e"/><text x="302.6666666666667" y="103" font-size="10.5" class="dim">3333x (3 ms)</text><text x="120" y="134" font-size="12.5" text-anchor="end">XA</text><rect x="130" y="115" width="2.0" height="15.0" rx="3" fill="#4da3ff"/><text x="138" y="128" font-size="10.5" class="dim">31x (323 ms)</text><rect x="130" y="130" width="71.4" height="15.0" rx="3" fill="#4f8a5e"/><text x="207.42857142857144" y="143" font-size="10.5" class="dim">1429x (7 ms)</text><text x="120" y="174" font-size="12.5" text-anchor="end">DSP</text><rect x="130" y="155" width="2.0" height="15.0" rx="3" fill="#4da3ff"/><text x="138" y="168" font-size="10.5" class="dim">12x (861 ms)</text><rect x="130" y="170" width="125.0" height="15.0" rx="3" fill="#4f8a5e"/><text x="261" y="183" font-size="10.5" class="dim">2500x (4 ms)</text><text x="120" y="214" font-size="12.5" text-anchor="end">ADX</text><rect x="130" y="195" width="8.3" height="15.0" rx="3" fill="#4da3ff"/><text x="144.33333333333334" y="208" font-size="10.5" class="dim">167x (60 ms)</text><rect x="130" y="210" width="83.3" height="15.0" rx="3" fill="#4f8a5e"/><text x="219.33333333333334" y="223" font-size="10.5" class="dim">1667x (6 ms)</text><text x="120" y="254" font-size="12.5" text-anchor="end">AICA</text><rect x="130" y="235" width="20.0" height="15.0" rx="3" fill="#4da3ff"/><text x="156" y="248" font-size="10.5" class="dim">400x (25 ms)</text><rect x="130" y="250" width="100.0" height="15.0" rx="3" fill="#4f8a5e"/><text x="236" y="263" font-size="10.5" class="dim">2000x (5 ms)</text><text x="120" y="294" font-size="12.5" text-anchor="end">Yamaha WAV</text><rect x="130" y="275" width="71.4" height="15.0" rx="3" fill="#4da3ff"/><text x="207.42857142857144" y="288" font-size="10.5" class="dim">1429x (7 ms)</text><rect x="130" y="290" width="250.0" height="15.0" rx="3" fill="#4f8a5e"/><text x="386" y="303" font-size="10.5" class="dim">5000x (2 ms)</text><text x="120" y="334" font-size="12.5" text-anchor="end">OKI WAV</text><rect x="130" y="315" width="250.0" height="15.0" rx="3" fill="#4da3ff"/><text x="386" y="328" font-size="10.5" class="dim">5000x (2 ms)</text><rect x="130" y="330" width="500.0" height="15.0" rx="3" fill="#4f8a5e"/><text x="636" y="343" font-size="10.5" class="dim">10000x (1 ms)</text><text class="dim" x="20" y="370" font-size="11">Node v24.20.0, one Windows PC, median of 3 runs after a warm-up.</text></svg>