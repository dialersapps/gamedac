<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="t d"><title id="t">Agreement with vgmstream</title><desc id="d">For each test file, whether vgmstream decodes the bytes gamedac wrote to exactly the same samples. Green rows are bit-identical for every signal tried; amber rows could not be opened by vgmstream for at least one signal.</desc><style>text{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#e6ecf5}.dim{fill:#9fb4cc}</style><rect width="100%" height="100%" rx="10" fill="#0b0f14" stroke="#24364a"/><text x="20" y="26" font-size="14" font-weight="600">Decoded by gamedac and by vgmstream: identical samples?</text><rect x="20" y="54" width="720" height="24" rx="6" fill="#1a2c1f" stroke="#4f8a5e"/><text x="34" y="71" font-size="12.5" font-weight="600">vag mono 44.1k</text><text class="dim" x="726" y="71" font-size="11.5" text-anchor="end">bit-identical (2 of 2 signals)</text><rect x="20" y="84" width="720" height="24" rx="6" fill="#1a2c1f" stroke="#4f8a5e"/><text x="34" y="101" font-size="12.5" font-weight="600">vag mono 22.05k</text><text class="dim" x="726" y="101" font-size="11.5" text-anchor="end">bit-identical (2 of 2 signals)</text><rect x="20" y="114" width="720" height="24" rx="6" fill="#1a2c1f" stroke="#4f8a5e"/><text x="34" y="131" font-size="12.5" font-weight="600">vag stereo (VAGi)</text><text class="dim" x="726" y="131" font-size="11.5" text-anchor="end">bit-identical (2 of 2 signals)</text><rect x="20" y="144" width="720" height="24" rx="6" fill="#1a2c1f" stroke="#4f8a5e"/><text x="34" y="161" font-size="12.5" font-weight="600">xa stereo 37.8k</text><text class="dim" x="726" y="161" font-size="11.5" text-anchor="end">bit-identical (2 of 2 signals)</text><rect x="20" y="174" width="720" height="24" rx="6" fill="#2a2216" stroke="#a67c2e"/><text x="34" y="191" font-size="12.5" font-weight="600">xa mono 18.9k</text><text class="dim" x="726" y="191" font-size="11.5" text-anchor="end">1 of 2 signals identical; 1 not opened</text><rect x="20" y="204" width="720" height="24" rx="6" fill="#1a2c1f" stroke="#4f8a5e"/><text x="34" y="221" font-size="12.5" font-weight="600">dsp mono 32k</text><text class="dim" x="726" y="221" font-size="11.5" text-anchor="end">bit-identical (2 of 2 signals)</text><rect x="20" y="234" width="720" height="24" rx="6" fill="#1a2c1f" stroke="#4f8a5e"/><text x="34" y="251" font-size="12.5" font-weight="600">dsp stereo 32k</text><text class="dim" x="726" y="251" font-size="11.5" text-anchor="end">bit-identical (2 of 2 signals)</text><rect x="20" y="264" width="720" height="24" rx="6" fill="#1a2c1f" stroke="#4f8a5e"/><text x="34" y="281" font-size="12.5" font-weight="600">adx stereo 44.1k</text><text class="dim" x="726" y="281" font-size="11.5" text-anchor="end">bit-identical (2 of 2 signals)</text><rect x="20" y="294" width="720" height="24" rx="6" fill="#1a2c1f" stroke="#4f8a5e"/><text x="34" y="311" font-size="12.5" font-weight="600">adx mono 22.05k</text><text class="dim" x="726" y="311" font-size="11.5" text-anchor="end">bit-identical (2 of 2 signals)</text><rect x="20" y="324" width="720" height="24" rx="6" fill="#1a2c1f" stroke="#4f8a5e"/><text x="34" y="341" font-size="12.5" font-weight="600">aica (Yamaha WAV, AICA variant) 22.05k</text><text class="dim" x="726" y="341" font-size="11.5" text-anchor="end">bit-identical (2 of 2 signals)</text><rect x="20" y="354" width="720" height="24" rx="6" fill="#2a2216" stroke="#a67c2e"/><text x="34" y="371" font-size="12.5" font-weight="600">oki-wav 8k</text><text class="dim" x="726" y="371" font-size="11.5" text-anchor="end">vgmstream cannot open this file</text><rect x="20" y="384" width="720" height="24" rx="6" fill="#1a2c1f" stroke="#4f8a5e"/><text x="34" y="401" font-size="12.5" font-weight="600">vb raw 22.05k (via TXTH)</text><text class="dim" x="726" y="401" font-size="11.5" text-anchor="end">bit-identical (2 of 2 signals)</text><rect x="20" y="414" width="720" height="24" rx="6" fill="#1a2c1f" stroke="#4f8a5e"/><text x="34" y="431" font-size="12.5" font-weight="600">aica raw 44.1k (via TXTH)</text><text class="dim" x="726" y="431" font-size="11.5" text-anchor="end">bit-identical (2 of 2 signals)</text><rect x="20" y="444" width="720" height="24" rx="6" fill="#1a2c1f" stroke="#4f8a5e"/><text x="34" y="461" font-size="12.5" font-weight="600">oki vox 8k vs vgmstream OKI4S (via TXTH)</text><text class="dim" x="726" y="461" font-size="11.5" text-anchor="end">bit-identical (2 of 2 signals)</text></svg>